CONFIG_RAM_POWER_DOWN_LIBRARY=y

# Powering the RAM back on before a software reset is required so that the
# device can boot again after having powered down unused RAM.
CONFIG_NRF_FORCE_RAM_ON_REBOOT=y

# Used to reboot the device as part of the test.
CONFIG_REBOOT=y
